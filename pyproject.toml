[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vaultzero"
version = "0.1.3"
# This string is what MCP directories show next to the listing, so it names the thing a
# prospective user is looking for (an MCP server) before the architecture behind it.
description = "MCP server for a privacy-first agent memory vault: memories are encrypted on the client before they reach the server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VaultZero contributors" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "agent-memory",
    "long-term-memory",
    "privacy",
    "encryption",
    "end-to-end-encryption",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]

# This package IS an MCP server, so its runtime dependencies are hard dependencies. They were
# previously behind a `client` extra with an `mcp` extra that re-exported it, which broke the
# one thing directories do: render an install command from `server.json`. A manifest can name
# a package but cannot express `vaultzero[mcp]`, so `uvx vaultzero` resolved a package with no
# dependencies, the console script failed to import, and Glama reported "does not currently
# have a deployable release" while the package was in fact published and working.
#
# The cost is that `pip install vaultzero` (SDK-only use) also pulls cryptography and mcp.
# For a package whose entire headline is the MCP server, that is the right trade.
dependencies = [
    "cryptography>=43",
    "httpx>=0.28",
    "mcp>=1.6,<2",
]

[project.optional-dependencies]
# `client` and `mcp` listed everything they needed before this change. They are kept, empty,
# so the strings `vaultzero[client]` and `vaultzero[mcp]` still resolve: they appear in
# published READMEs, in this repo's history, and in other people's requirements files, and a
# self-referential alias (`vaultzero = ["vaultzero"]`) is a dependency cycle that pip and uv
# both reject. An empty extra is the compatible way to keep the names working.
client = []
mcp = []
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[project.scripts]
vaultzero-mcp = "vaultzero.client.mcp_server:main"

[project.urls]
Homepage = "https://vaultzero.cc"
Documentation = "https://github.com/xo0ps/VaultZero-Client#readme"
Issues = "https://github.com/xo0ps/VaultZero-Client/issues"
Repository = "https://github.com/xo0ps/VaultZero-Client"
Source = "https://github.com/xo0ps/VaultZero-Client"

[tool.uv]
# Resolve from public PyPI only, whatever a developer's global uv configuration points at. A
# corporate or private index would otherwise leak into uv.lock and make the project
# unresolvable for everyone else (403 on a package the lock references). The global config is
# untouched.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["vaultzero"]

[tool.hatch.build.targets.sdist]
include = ["vaultzero", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S607"]
