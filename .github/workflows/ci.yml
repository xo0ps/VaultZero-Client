name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository. Nothing here publishes, so no
# job needs write access, and a compromised dependency cannot push with a stolen token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: MCP registry readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # A published listing is built from these files. Drift (a version bumped in one place
      # but not the other, a description over the schema's limit, a missing LICENSE) fails
      # as a rejected submission or a stale entry, not as a failing test. Check it here.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: server.json, LICENSE, Dockerfile and README agree
        run: python scripts/check-registry-ready.py

  test:
    name: lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra client --extra dev

      - name: Lint
        run: uv run --no-sync ruff check .

      # Format is NOT enforced. Reformatting would rewrite the AAD-construction code in
      # crypto.py, which the golden vectors pin, for whitespace only. Adding that churn to an
      # unrelated change makes the one file that must stay byte-stable harder to review. Add
      # `ruff format` in a dedicated commit if it is wanted.

      - name: Tests
        run: uv run --no-sync python -m pytest -q

      # The wheel is what a directory installs, and it must carry the console script and the
      # LICENSE. A packaging change that drops either is invisible to the tests above.
      - name: Build wheel
        run: uv build

      - name: Wheel carries the entry point and the license
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("licenses/LICENSE") for n in names), "LICENSE missing from wheel"
          entry = [n for n in names if n.endswith("entry_points.txt")][0]
          text = zipfile.ZipFile(wheel).read(entry).decode()
          assert "vaultzero-mcp" in text, f"console script missing: {text}"
          print(f"{wheel}: entry point and LICENSE present")
          PY

  container:
    name: container serves MCP over stdio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t vaultzero-mcp:ci .

      # A directory that accepts Docker will run the image. If it cannot complete an MCP
      # handshake over stdio, the listing is broken for every Docker-based client — and a
      # stray print() to stdout is enough to corrupt the protocol stream, so this is the
      # check that catches it.
      - name: Handshake and list tools
        run: |
          CREDENTIAL=$(printf '0%.0s' $(seq 64))
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          | docker run -i --rm \
              -e VZ_BASE_URL=https://api.example.invalid \
              -e VZ_CREDENTIAL="$CREDENTIAL" \
              vaultzero-mcp:ci > /tmp/mcp.out

          python - <<'PY'
          import json
          seen = {"server": False, "tools": False}
          for line in open("/tmp/mcp.out"):
              line = line.strip()
              if not line:
                  continue
              # Every stdout line must be JSON-RPC. Anything else has corrupted the stream.
              message = json.loads(line)
              result = message.get("result", {})
              if "serverInfo" in result:
                  seen["server"] = True
              if "tools" in result:
                  assert {t["name"] for t in result["tools"]} == {
                      "remember_fact", "recall_context"
                  }, result["tools"]
                  seen["tools"] = True
          assert all(seen.values()), seen
          print("handshake ok, both tools listed")
          PY

      - name: Runs unprivileged with no pip
        run: |
          docker run --rm --entrypoint sh vaultzero-mcp:ci -c '
            test "$(id -u)" = "10001"
            ! command -v pip
          '
